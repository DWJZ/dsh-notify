# dsh-notify bundle 层：只声明"插一个宿主插件行"，凭证与开关放在
# profile 的 cordis.patch.yml（`- id: dsh-notify` 那一行），这样本目录以后
# 进版本库也不会泄露 webhook 与 bot token。
#
# 安装：用 plugin_manager 的 install_bundle 指向本目录（它负责写 profile 的
# package.json 与 cordis.patch.yml，不要手改）。
#
# 配置字段（全部在 profile 里写）：
#   discordWebhookUrl      发通知用的频道 Webhook（消息显示为 bot）
#   discordBotToken        读回复用的 bot token
#   discordChannelId       读回复的频道 id
#   discordAllowedUserId   只接受这个用户的回复
#   replyWindowMs          等回复的上限，默认 600000（10 分钟）
#   pollIntervalMs         轮询间隔，默认 3000
#   label                  消息首行标识，默认 DSH
#   ttlMs / minGapMs       去重与限速
#   enabled: false         临时关掉
- insert:
    - id: dsh-notify
      name: dsh-notify
